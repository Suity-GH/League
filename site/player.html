<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Profile | League Archive</title>
  <meta name="description" content="Player profile across RuneScape Leagues.">
  <link rel="stylesheet" href="/theme.css">
</head>
<body>
  <nav class="topnav"></nav>

  <div class="banner"></div>

  <main class="page">
    <header class="profile-head">
      <img class="avatar" src="/img/logo_200.webp" alt="" onerror="this.remove()">
      <h1 class="player-name" id="playerName">Player Profile</h1>
      <div class="aka hidden" id="aliases"></div>
    </header>

    <p class="note hidden" id="profileError"></p>

    <div id="profile">
      <div class="totals" id="totals"></div>

      <section class="section hidden" id="achievementsSection">
        <div class="section-head"><h2 class="section-title">Achievements</h2></div>
        <div class="ach-grid" id="achievementsList"></div>
        <button type="button" class="ach-more hidden" id="achievementsMore"></button>
      </section>

      <section class="section">
        <div class="section-head"><h2 class="section-title">Old School Leagues</h2></div>
        <div class="table-wrap">
          <table class="hs-table">
            <thead><tr><th>League</th><th>Rank</th><th>Points</th><th>Trophy</th></tr></thead>
            <tbody id="osrsBody"></tbody>
          </table>
        </div>
      </section>

      <section class="section" id="rs3Section">
        <div class="section-head"><h2 class="section-title">RuneScape 3 Leagues</h2></div>
        <div class="table-wrap">
          <table class="hs-table">
            <thead><tr><th>League</th><th>Rank</th><th>Points</th><th>Trophy</th></tr></thead>
            <tbody id="rs3Body"></tbody>
          </table>
        </div>
      </section>

      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Top 250 Hiscores</h2>
          <div class="select" id="hiscoreLeague"></div>
        </div>
        <p class="note" id="hiscoresNote"></p>
        <div id="hiscoreTables"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer">Powered by SuityBot</footer>

  <script src="/common.js"></script>
  <script src="/player.js"></script>
  <script src="/nav-search.js"></script>
  <script src="/patrons.js"></script>
</body>
</html>
